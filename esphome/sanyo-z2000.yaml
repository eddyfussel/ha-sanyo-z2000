esphome:
  name: sanyo
  friendly_name: Sanyo Z2000

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 0  # disable logging over UART

uart:
  id: uart_bus
  tx_pin: 17
  rx_pin: 16
  baud_rate: 19200
  data_bits: 8
  parity: NONE
  stop_bits: 1

# Expose UART as network serial port via ESPHome Native API
serial_proxy:
  name: "Sanyo Z2000 RS232"
  uart_id: uart_bus
  port_type: RS232

# Home Assistant Native API (required by serial_proxy)
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # --- Reachability after a power cut -------------------------------------
  # The ESP usually shares power with the projector (energy-saving plug), so
  # it reboots every time the projector is switched on. These settings make
  # sure Home Assistant can reach it again quickly and reliably afterwards.

  # WiFi power-save can leave an otherwise-idle ESP32 slow to answer or briefly
  # off the network — disable it for a device that must always be reachable.
  power_save_mode: none

  # If WiFi can't be (re)joined for this long, reboot and try again from
  # scratch. Guards against the ESP booting faster than the router/AP after a
  # power outage and then getting stuck.
  reboot_timeout: 5min

  # STRONGLY RECOMMENDED: pin this ESP to a fixed address so HA never ends up
  # stuck on a stale IP after a DHCP change (the classic "unreachable after
  # power cycle / [Errno 113] No route to host" symptom). Easiest option is a
  # DHCP reservation in your router. Alternatively set a static IP here:
  # manual_ip:
  #   static_ip: 192.168.105.137
  #   gateway: 192.168.105.1
  #   subnet: 255.255.255.0

  ap:
    ssid: !secret ap_ssid
    password: !secret ap_password

captive_portal:
